name: CI - Test & Coverage

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Tests with Coverage
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libleveldb-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install -e .
    
    - name: Run tests with coverage
      run: |
        pytest --cov=. --cov-branch --cov-report=xml --cov-report=term -v 2>&1 | tee test_results.txt
      timeout-minutes: 30
      continue-on-error: true
    
    - name: Upload results to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.python-version }}
        fail_ci_if_error: false
        verbose: true
    
    - name: Upload coverage report as artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: |
          coverage.xml
          test_results.txt
    
    - name: Comment PR with coverage summary
      if: github.event_name == 'pull_request' && matrix.python-version == '3.11'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          let coverageSummary = '';
          try {
            const results = fs.readFileSync('test_results.txt', 'utf8');
            
            // Extract coverage percentage
            const coverageMatch = results.match(/TOTAL\s+\d+\s+\d+\s+\d+\s+\d+\s+(\d+)%/);
            const coverage = coverageMatch ? coverageMatch[1] : 'N/A';
            
            coverageSummary = `## Test Coverage Report (Python ${{ matrix.python-version }})
          
          - **Coverage**: ${coverage}%
          - **Python Version**: ${{ matrix.python-version }}
          
          [View detailed report on Codecov](https://codecov.io/gh/${{ github.repository }})`;
          } catch (error) {
            coverageSummary = '## Test Coverage Report\n\nCoverage report generation in progress...';
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: coverageSummary
          });
